<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>안녕하세요</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #2196f3;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background-color: white;
            width: 500px;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        h1 {
            color: #333;
        }

        h2 {
            color: #555;
            margin-top: 30px;
        }

        p {
            color: #666;
            line-height: 1.8;
        }

        .skills {
            margin-top: 25px;
            padding: 15px;
            background-color: #f0f2f5;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>안녕하세요 👋</h1>

        <h2>안형근입니다.</h2>

        <p>
            IT 인프라 운영 업무를 담당하고 있습니다.
        </p>

        <p>
            네트워크, 서버, 보안 인프라에 관심이 많으며
            새로운 기술을 배우고 직접 만들어보는 것을 좋아합니다.
        </p>

        <div class="skills">
            <strong>관심 분야</strong>
            <p>
                Network · Server · Security · Cloud · AI
            </p>
        </div>
    </div>

</body>
</html>
